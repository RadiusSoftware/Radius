    <widget tagname="dialog-widget">
        <script>
            class DialogWidget extends PopupWidget {
                static dialogTypes = mkRdsEnum('ok', 'close', 'confirm', 'submit');

                computeLayout() {
                    if (mainPanel.getHorzCategory() == 'standard') {
                        this.setClassName('dialog-widget-standard');
                        this.clearClassName('dialog-widget-small');
                    }
                    else {
                        this.setClassName('dialog-widget-small');
                        this.clearClassName('dialog-widget-standard');
                    }
                }

                disableCancelButton() {
                    if (this.dialogType == 'confirm' || this.dialogType == 'submit') {
                        let cancelButton = this.buttons.getChildElementAt(1);
                        cancelButton.setAttribute('disabled');
                    }

                    return this;
                }

                disableCloseButton() {
                    if (this.dialogType == 'close') {
                        let closeButton = this.buttons.getChildElementAt(0);
                        closeButton.setAttribute('disabled');
                    }

                    return this;
                }

                disableConfirmButton() {
                    if (this.dialogType == 'confirm') {
                        let confirmButton = this.buttons.getChildElementAt(0);
                        confirmButton.setAttribute('disabled');
                    }

                    return this;
                }

                disableOkButton() {
                    if (this.dialogType == 'ok') {
                        let okButton = this.buttons.getChildElementAt(0);
                        okButton.setAttribute('disabled');
                    }

                    return this;
                }

                disableSubmitButton() {
                    if (this.dialogType == 'submit') {
                        let submitButton = this.buttons.getChildElementAt(0);
                        submitButton.setAttribute('disabled');
                    }

                    return this;
                }

                enableCancelButton() {
                    if (this.dialogType == 'confirm' || this.dialogType == 'submit') {
                        let cancelButton = this.buttons.getChildElementAt(1);
                        cancelButton.clearAttribute('disabled');
                    }

                    return this;
                }

                enableCloseButton() {
                    if (this.dialogType == 'close') {
                        let closeButton = this.buttons.getChildElementAt(0);
                        closeButton.clearAttribute('disabled');
                    }

                    return this;
                }

                enableConfirmButton() {
                    if (this.dialogType == 'confirm') {
                        let confirmButton = this.buttons.getChildElementAt(0);
                        confirmButton.clearAttribute('disabled');
                    }

                    return this;
                }

                enableOkButton() {
                    if (this.dialogType == 'ok') {
                        let okButton = this.buttons.getChildElementAt(0);
                        okButton.clearAttribute('disabled');
                    }

                    return this;
                }

                enableSubmitButton() {
                    if (this.dialogType == 'submit') {
                        let submitButton = this.buttons.getChildElementAt(0);
                        submitButton.clearAttribute('disabled');
                    }

                    return this;
                }

                init() {
                    if (this.getRdsDialogType) {
                        this.setDialogType(this.getRdsDialogType());
                    }
                    else {
                        this.setDialogType('ok');
                    }

                    this.setButtons();
                    super.init();
                }
                
                onInspectEventClick(event) {
                    let source = event.getSrcElement();
                    
                    if (source.getRdsDialogAction) {
                        event.kill();
                        let value = source.getRdsDialogAction();
                        this.hide(value);

                        this.emit({
                            name: 'DialogDone',
                            value: value,
                        });
                    }
                }

                onHandleEventCancelbuttondisable(event) {
                    this.disableCancelButton();
                }

                onHandleEventCancelbuttonenable(event) {
                    this.enableCancelButton();
                }

                onHandleEventClosebuttondisable(event) {
                    this.disableCloseButton();
                }

                onHandleEventClosebuttonenable(event) {
                    this.enableCloseButton();
                }

                onHandleEventConfirmbuttondisable(event) {
                    this.disableConfirmButton();
                }

                onHandleEventCancelbuttonenable(event) {
                    this.enableCancelButton();
                }

                onHandleEventOkbuttondisable(event) {
                    this.disableOkButton();
                }

                onHandleEventOkbuttonenable(event) {
                    this.enableOkButton();
                }

                onHandleEventSubmitbuttondisable(event) {
                    this.disableSubmitButton();
                }

                onHandleEventSubmitbuttonenable(event) {
                    this.enableSubmitButton();
                }

                setButtons() {
                    this.buttons = this.getChildElementAt(0).getChildElementAt(10);

                    if (this.dialogType == 'ok') {
                        this.buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##ok##',
                                    'rds-dialog-action': 'ok',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'close') {
                        this.buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##close##',
                                    'rds-dialog-action': 'close',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'confirm') {
                        this.buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##confirm##',
                                    'rds-dialog-action': 'confirm',
                                }
                            ),

                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##cancel##',
                                    'rds-dialog-action': 'cancel',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'submit') {
                        this.buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##submit##',
                                    'rds-dialog-action': 'submit',
                                }
                            ),

                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##cancel##',
                                    'rds-dialog-action': 'cancel',
                                }
                            )
                        );
                    }

                    return this;
                }

                setContent(arg) {
                    let content;
                    let container = this.getChildElementAt(0).getChildElementAt(4);

                    if (StringType.verify(arg)) {
                        content = createElementFromOuterHtml(arg);
                    }
                    else if (arg instanceof DocElement) {
                        content = arg;
                    }

                    container.append(content);
                    return this;
                }

                setDialogType(dialogType) {
                    if (DialogWidget.dialogTypes.has(dialogType)) {
                        this.dialogType = dialogType;
                    }
                    else {
                        this.dialogType = 'ok';
                    }

                    return this;
                }

                setSize() {
                    let width = '600px';
                    let height = '100%';
                    this.setStyle({ width: width, height: height });
                }
            }
        </script>

    <script>
        define(function showDialog(dialogType, content) {
            return createElement(
                'dialog-widget',
                {
                    'rds-modal': '',
                    'rds-dialog-type': dialogType,
                }
            )
            .setContent(content)
            .show();
        });

    <widget tagname="form-widget">
        <script type="settings">
            {
                "substitute": "form"
            }
        </script>
        <script>
            class FormWidget extends Widget {
                init() {
                    super.init();
                    this.reset = {};
                    this.editing = null;
                    this.submittable = false;

                    if (FunctionType.verify(this.getRdsAction)) {
                        let action = RdsText.split(this.getRdsAction(), ',');

                        if (action.length > 1) {
                            this.method = action[0];
                            this.dotteds = action.slice(1);

                            for (let dotted of this.dotteds) {
                                if (Controller.hasData(dotted)) {
                                    this.reset[dotted] = RdsData.clone(Controller.getValue(dotted));
                                }
                                else {
                                    return;
                                }
                            }

                            this.submittable = true;
                        }
                    }
                }

                async onHandleEventReset(event) {
                    if (this.submittable) {
                        for (let dotted in this.reset) {
                            Controller.setValue(dotted, this.reset[dotted]);
                        }
                    }
                }

                async onHandleEventSubmit(event) {
                    if (this.submittable) {
                        let result = await Api[this.method](
                            ...this.dotteds.map(dotted => Controller.getValue(dotted))
                        );

                        if (appWidget) {
                            let handlerName = `on${this.method[0].toUpperCase()}${this.method.substring(1)}`;

                            if (handlerName in appWidget) {
                                appWidget[handlerName]({
                                    form: this,
                                    method: this.method,
                                    dotteds: this.dotteds,
                                    result: result,
                                });
                            }
                        }
                    }
                }

                onHandleEventEditStart(event) {
                    if (this.editing) {
                        this.editing.stopEdit();
                        this.editing = event.getTarget();
                    }
                    else {
                        this.editing = event.getTarget();
                    }
                }

                onHandleEventEditStop(event) {
                    if (this.editing) {
                        this.editing = null;
                    }
                }
                
                onInspectEventKeydown(event) {
                    if (this.editing) {
                        if (event.getKey() == 'Escape') {
                            this.editing.cancelEdit();
                            event.kill();
                        }
                        else if (event.getKey() == 'Enter') {
                            this.editing.stopEdit();
                            event.kill()
                        }
                    }
                    else {
                        if (event.getKey() == 'Enter') {
                            let activeElement = Doc.getActiveElement();

                            if (activeElement) {
                                if (activeElement.getTagName() == 'scalar-widget') {
                                    activeElement.startEdit();
                                }
                                else if (activeElement.hasAttribute('evt-click')) {
                                    activeElement.triggerCustomEvent('click');
                                }
                            }
                        }
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="grid-widget">
        <script>
            class GridWidget extends Widget {
                computeGeometry() {
                    this.rows.length == 0 ? this.rows.push('100%') : null;
                    this.cols.length == 0 ? this.cols.push('100%') : null;
                    this.cells = this.rows.length * this.cols.length;

                    let style = {
                        display: 'grid',
                        gridTemplateRows: `${this.rows.join(' ')}`,
                        gridTemplateColumns: `${this.cols.join(' ')}`,
                        rowGap: `${this.rowGap}`,
                        colGap: `${this.colGap}`,
                    };

                    this.setStyle(style);
                }
                
                generatePlaceholders() {
                    this.clear();

                    for (let i = 0; i < this.cells; i++) {
                        this.append(mkHtmlElement('div'));
                    }

                    return this;
                }

                getAt(row, col) {
                    let index = row * this.cols.length + col;
                    return this.getChildElementAt(index);
                }
                
                getCols() {
                    return this.cols;
                }

                getRows() {
                    return this.rows;
                }

                init() {
                    this.rows = [];
                    this.cols = [];
                    this.cells = 0;
                    this.rowGap = '0px';
                    this.colGap = '0px';

                    super.init();

                    if (this.getRdsColCount) {
                        this.setColCount(parseInt(this.getRdsColCount()));
                    }

                    if (this.getRdsColGap) {
                        this.colGap = this.getRdsColGap();
                    }

                    if (this.getRdsCols) {
                        this.cols = RdsText.split(this.getRdsCols(), ',');
                    }

                    if (this.getRdsRowCount) {
                        this.setRowCount(parseInt(this.getRdsRowCount()));
                    }

                    if (this.getRdsRowGap) {
                        this.rowGap = this.getRdsRowGap();
                    }

                    if (this.getRdsRows) {
                        this.rows = RdsText.split(this.getRdsRows(), ',');
                    }

                    this.computeGeometry();

                    if (this.getRdsPlaceholders) {
                        this.generatePlaceholders();
                    }
                }

                setAt(row, col, htmlElement) {
                    let index = row * this.cols.length + col;
                    let child = this.getChildElementAt(index);
                    child.replace(htmlElement);
                    return this;
                }

                setColCount(count) {
                    let cols = [];

                    if (count > 0) {
                        this.cols = [];
                        let width = `${100/count}%`;

                        for (let i = 0; i < count; i++) {
                            this.cols.push(width);
                        }
                    }

                    return this;
                }

                setColGap(colGap) {
                    this.colGap = colGap;
                    return this;
                }

                setCols(cols) {
                    this.cols = cols;
                    return this;
                }

                setGeometry(rows, cols) {
                    this.rows = rows;
                    this.cols = cols;
                    return this;
                }

                setRowCount(count) {
                    this.rows = [];

                    if (count > 0) {
                        let height = `${100/count}%`;

                        for (let i = 0; i < count; i++) {
                            this.rows.push(height);
                        }
                    }

                    return this;
                }

                setRowGap(rowGap) {
                    this.rowGap = rowGap;
                    return this;
                }

                setRows(rows) {
                    this.rows = rows;
                    return this;
                }
            }
        </script>

    <widget tagname="progress-widget">
        <script>
            class ProgressWidget extends Widget {
                init() {
                    super.init();
                    this.setClassName('progress-widget');

                    if (this.getRdsWebsocketPath) {
                        this.webSocket = mkWebsocket(this.getRdsWebsocketPath()).connect();
                        this.triggerCustomEvent('closebuttondisable');

                        this.webSocket.on('closed', message => {
                            this.triggerCustomEvent('closebuttonenable'); 
                        });

                        this.webSocket.on('RdsUpdate', message => {
                            this.append(
                                createElement('div', {
                                    class: 'progress-entry'
                                })
                                .setInnerHtml(message.value)
                            );
                        });
                    }
                }
            }
        </script>
