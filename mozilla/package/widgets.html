    <widget tagname="dialog-widget">
        <script>
            class DialogWidget extends PopupWidget {
                static dialogTypes = mkRdsEnum('none', 'ok', 'cancel', 'confirm', 'submit');

                getOffsetWidth() {
                    let buttons = this.getChildElementAt(0).getChildElementAt(10);
                    let buttonWidth = buttons.getOffsetWidth();

                    let content = this.getChildElementAt(0).getChildElementAt(4);
                    let contentWidth = content.getOffsetWidth();

                    let width = buttonWidth >= contentWidth ? buttonWidth : contentWidth;
                    let grid = this.getChildElementAt(0);
                    width += parseInt(grid.rows[0]);
                    width += parseInt(grid.rows[grid.rows.length - 1]);

                    return width;
                }

                init() {
                    if (this.getRdsDialogType) {
                        this.setDialogType(this.getRdsDialogType());
                    }
                    else {
                        this.setDialogType('ok');
                    }

                    this.setModal();
                    this.setButtons();
                    super.init();
                }
                
                onInspectEventClick(event) {
                    let source = event.getSrcElement();
                    
                    if (source.getRdsDialogAction) {
                        let value;

                        if (source.getRdsDialogAction() == 'ok') {
                            value = 'ok';
                        }
                        else if (source.getRdsDialogAction() == 'cancel') {
                            value = 'cancel';
                        }
                        else if (source.getRdsDialogAction() == 'confirm') {
                            value = 'confirm';
                        }
                        else if (source.getRdsDialogAction() == 'submit') {
                            value = 'submit';
                        }

                        event.kill();
                        this.hide(value);

                        this.emit({
                            name: 'DialogDone',
                            value: value,
                        });
                    }
                }

                setButtons() {
                    let buttons = this.getChildElementAt(0).getChildElementAt(10);

                    if (this.dialogType == 'ok') {
                        buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##ok##',
                                    'rds-dialog-action': 'ok',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'cancel') {
                        buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##cancel##',
                                    'rds-dialog-action': 'cancel',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'confirm') {
                        buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##confirm##',
                                    'rds-dialog-action': 'confirm',
                                }
                            ),

                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##cancel##',
                                    'rds-dialog-action': 'cancel',
                                }
                            )
                        );
                    }
                    else if (this.dialogType == 'submit') {
                        buttons.append(
                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##submit##',
                                    'rds-dialog-action': 'submit',
                                }
                            ),

                            createElement(
                                'button-widget',
                                {
                                    class: 'input-widget-width-medium',
                                    'rds-label': '##cancel##',
                                    'rds-dialog-action': 'cancel',
                                }
                            )
                        );
                    }

                    return this;
                }

                setContent(...args) {
                    let content = this.getChildElementAt(0).getChildElementAt(4);

                    for (let arg of args) {
                        if (StringType.verify(arg)) {
                            content.append(createElementFromOuterHtml(arg));
                        }
                        else if (arg instanceof DocElement) {
                            content.append(arg);
                        }
                    }

                    return this;
                }

                setDialogType(dialogType) {
                    if (DialogWidget.dialogTypes.has(dialogType)) {
                        this.dialogType = dialogType;
                    }

                    return this;
                }
            }
        </script>

    <widget tagname="form-widget">
        <script type="settings">
            {
                "substitute": "form"
            }
        </script>
        <script>
            class FormWidget extends Widget {
                init() {
                    super.init();
                    this.reset = {};
                    this.editing = null;
                    this.submittable = false;

                    if (FunctionType.verify(this.getRdsAction)) {
                        let action = RdsText.split(this.getRdsAction(), ',');

                        if (action.length > 1) {
                            this.method = action[0];
                            this.dotteds = action.slice(1);

                            for (let dotted of this.dotteds) {
                                if (Controller.hasData(dotted)) {
                                    this.reset[dotted] = RdsData.clone(Controller.getValue(dotted));
                                }
                                else {
                                    return;
                                }
                            }

                            this.submittable = true;
                        }
                    }
                }

                async onHandleEventReset(message) {
                    if (this.submittable) {
                        for (let dotted in this.reset) {
                            Controller.setValue(dotted, this.reset[dotted]);
                        }
                    }
                }

                async onHandleEventSubmit(message) {
                    if (this.submittable) {
                        let result = await Api[this.method](
                            ...this.dotteds.map(dotted => Controller.getValue(dotted))
                        );

                        if (appWidget) {
                            let handlerName = `on${this.method[0].toUpperCase()}${this.method.substring(1)}`;

                            if (handlerName in appWidget) {
                                appWidget[handlerName]({
                                    method: this.method,
                                    dotteds: this.dotteds,
                                    result: result,
                                });
                            }
                        }
                    }
                }

                onHandleEventEditStart(event) {
                    if (this.editing) {
                        this.editing.stopEdit();
                        this.editing = event.getTarget();
                    }
                    else {
                        this.editing = event.getTarget();
                    }
                }

                onHandleEventEditStop(event) {
                    if (this.editing) {
                        this.editing = null;
                    }
                }
                
                onInspectEventKeydown(event) {
                    if (this.editing) {
                        if (event.getKey() == 'Escape') {
                            this.editing.cancelEdit();
                            event.kill();
                        }
                        else if (event.getKey() == 'Enter') {
                            this.editing.stopEdit();
                            event.kill()
                        }
                    }
                    else {
                        if (event.getKey() == 'Enter') {
                            let activeElement = Doc.getActiveElement();

                            if (activeElement) {
                                console.log(activeElement.getTagName());
                                if (activeElement.getTagName() == 'scalar-widget') {
                                    activeElement.startEdit();
                                }
                                else if (activeElement.hasAttribute('evt-click')) {
                                    activeElement.triggerCustomEvent('click');
                                }
                            }
                        }
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="grid-widget">
        <script>
            class GridWidget extends Widget {
                computeGeometry() {
                    this.rows.length == 0 ? this.rows.push('100%') : null;
                    this.cols.length == 0 ? this.cols.push('100%') : null;
                    this.cells = this.rows.length * this.cols.length;

                    let style = {
                        display: 'grid',
                        gridTemplateRows: `${this.rows.join(' ')}`,
                        gridTemplateColumns: `${this.cols.join(' ')}`,
                        rowGap: `${this.rowGap}`,
                        colGap: `${this.colGap}`,
                    };

                    this.setStyle(style);
                }
                
                generatePlaceholders() {
                    this.clear();

                    for (let i = 0; i < this.cells; i++) {
                        this.append(mkHtmlElement('div'));
                    }

                    return this;
                }

                getAt(row, col) {
                    let index = row * this.cols.length + col;
                    return this.getChildAt(index);
                }
                
                getCols() {
                    return this.cols;
                }

                getRows() {
                    return this.rows;
                }

                init() {
                    this.rows = [];
                    this.cols = [];
                    this.cells = 0;
                    this.rowGap = '0px';
                    this.colGap = '0px';

                    super.init();

                    if (this.getRdsColCount) {
                        this.setColCount(parseInt(this.getRdsColCount()));
                    }

                    if (this.getRdsColGap) {
                        this.colGap = this.getRdsColGap();
                    }

                    if (this.getRdsCols) {
                        this.cols = RdsText.split(this.getRdsCols(), ',');
                    }

                    if (this.getRdsRowCount) {
                        this.setRowCount(parseInt(this.getRdsRowCount()));
                    }

                    if (this.getRdsRowGap) {
                        this.rowGap = this.getRdsRowGap();
                    }

                    if (this.getRdsRows) {
                        this.rows = RdsText.split(this.getRdsRows(), ',');
                    }

                    this.computeGeometry();

                    if (this.getRdsPlaceholders) {
                        this.generatePlaceholders();
                    }
                }

                setAt(row, col, htmlElement) {
                    let index = row * this.cols.length + col;
                    let child = this.getChildAt(index);
                    child.replace(htmlElement);
                    return this;
                }

                setColCount(count) {
                    let cols = [];

                    if (count > 0) {
                        this.cols = [];
                        let width = `${100/count}%`;

                        for (let i = 0; i < count; i++) {
                            this.cols.push(width);
                        }
                    }

                    return this;
                }

                setColGap(colGap) {
                    this.colGap = colGap;
                    return this;
                }

                setCols(cols) {
                    this.cols = cols;
                    return this;
                }

                setGeometry(rows, cols) {
                    this.rows = rows;
                    this.cols = cols;
                    return this;
                }

                setRowCount(count) {
                    this.rows = [];

                    if (count > 0) {
                        let height = `${100/count}%`;

                        for (let i = 0; i < count; i++) {
                            this.rows.push(height);
                        }
                    }

                    return this;
                }

                setRowGap(rowGap) {
                    this.rowGap = rowGap;
                    return this;
                }

                setRows(rows) {
                    this.rows = rows;
                    return this;
                }
            }
        </script>
    </widget>

    <widget tagname="monitor-widget">
        <script>
            class MonitorWidget extends Widget {
                connect(webSocketPath) {
                    this.webSocket = mkWebsocket(webSocketPath);
                     
                    this.webSocket.on('WebsocketData', message => {
                        this.onNotification(message);
                    });

                    this.webSocket.on('open', message => {
                        this.webSocket.sendServerData('##READY##');
                    });

                    this.webSocket.connect();
                }

                init() {
                    this.setClassName('monitor-text')
                    super.init();

                    if (this.getRdsWebsocketPath) {
                        this.connect(this.getRdsWebsocketPath());
                    }
                }

                onNotification(message) {
                    if (message.type == 'string') {
                        this.append(
                            mkDocText(`${message.payload}`),
                            createElement('br'),
                        );
                    }
                }
            }
        </script>

    <widget tagname="selector-widget">
        <script>
            class SelectorWidget extends Widget {
                configureClientElement(clientElement) {
                    clientElement.setProperty('prevStyleSettings', clientElement.getStyle());

                    clientElement.setStyle({
                        display: 'none',
                        width: '100%',
                        height: '100%',
                        transitionProperty: 'opacity',
                        transitionDuration: `${this.duration}s`,
                    });

                    this.append(clientElement);
                    return this;
                }

                deconfigureClientElement(clientElement) {
                    clientElement.remove();
                    clientElement.setStyle(clientElement.getProperty('prevStyleSettings'));
                    clientElement.deleteProperty('prevStyleSettings');
                }

                getMode() {
                    return this.mode;
                }

                getModeClient(mode) {
                    return mode in this.modes ? this.modes[mode].client : null;
                }

                hasMode(mode) {
                    return mode in this.modes;
                }

                hideClient(clientElement) {
                    clientElement.setStyle({
                        display: 'none',
                        opacity: '.1',
                    });

                    return this;
                }

                init() {
                    this.mode = '';
                    this.modes = {};
                    this.clients = new WeakMap();
                    this.duration = .5;
                    super.init();

                    if (this.getRdsDuration) {
                        this.duration = parseFloat(this.getRdsDuration());
                    }
                    
                    for (let clientElement of this.getChildElements()) {
                        if (clientElement instanceof DocElement) {
                            if (typeof clientElement.getRdsMode == 'function') {
                                this.setClientElement(clientElement.getRdsMode(), clientElement);
                            }
                            else {
                                clientElement.remove();
                            }
                        }
                    }
                }

                listClients() {
                    let clients = [];
                    let clientMap = new WeakMap();

                    for (let mode in this.modes) {
                        clients.push(this.modes[mode]);
                    }

                    return clients;
                }

                listModes() {
                    return Object.keys(this.modes);
                }

                removeClient(clientElement) {
                    if (this.clients.has(clientElement)) {
                        let mode = this.clients.get(clientElement);
                        this.deconfigureClientElement(clientElement);
                        delete this.modes[mode];
                        this.clients.delete(clientElement);

                        if (mode == this.mode) {
                            this.mode = '';
                        }
                    }

                    return this;
                }

                removeMode(mode) {
                    if (mode in this.modes) {
                        let clientElement = this.modes[mode];
                        this.deconfigureClientElement(clientElement);
                        delete this.modes[mode];
                        this.clients.delete(clientElement);

                        if (mode == this.mode) {
                            this.mode = '';
                        }
                    }

                    return this;
                }

                removeModes() {
                    for (let mode of this.modes) {
                        this.deconfigure(this.modes[mode]);
                    }

                    this.clear();
                    this.mode = '';
                    this.modes = {};
                    this.clients = new WeakMap();
                    return this;
                }

                replaceClient(clientElement, newClientElement) {
                    if (clientElement instanceof DocElement && newClientElement instanceof DocElement) {
                        if (!clientElement.isSame(newClientElement)) {
                            if (this.clients.has(clientElement) && !this.clients.has(newClientElement)) {
                                let mode = this.clients.get(clientElement);
                                this.clients.delete(clientElement);
                                this.clients.set(newClientElement, mode);
                                this.modes[mode] = newClientElement;
                                this.deconfigureClientElement(clientElement);
                                this.configureClientElement(newClientElement);

                                if (mode == this.mode) {
                                    this.showClient(newClientElement);
                                }
                            }
                        }
                    }

                    return this;
                }

                resetMode() {
                    if (this.mode && this.mode in this.modes) {
                        this.hideClient(this.modes[this.mode]);
                    }

                    this.mode = '';
                    return this;
                }

                setClientElement(mode, clientElement) {
                    if (this.clients.has(clientElement)) {
                        let clientMode = this.clients.get(clientElement);

                        if (mode != clientMode) {
                            if (this.mode == clientMode) {
                                this.hideClient(clientElement);
                            }

                            delete this.modes[clientMode];
                            this.modes[mode] = clientElement;
                            this.clients.set(clientElement, mode);

                            if (this.mode == mode) {
                                this.showClient(clientElement);
                            }
                        }
                    }
                    else {
                        this.configureClientElement(clientElement);

                        if (mode in this.modes) {
                            if (!clientElement.isSame(this.modes[mode])) {
                                this.replaceClient(this.modes[mode], clientElement);
                            }
                        }
                        else {
                            this.modes[mode] = clientElement;
                            this.clients.set(clientElement, mode);

                            if (mode == this.mode) {
                                this.showClient(clientElement);
                            }
                        }
                    }
                    
                    return this;
                }

                setMode(mode) {
                    if (typeof mode == 'string' && (mode = mode.trim())) {
                        if (mode != this.mode) {
                            let prevClient;
                            let nextClient;

                            if (this.mode in this.modes) {
                                prevClient = this.modes[this.mode];
                            }

                            if (mode in this.modes) {
                                nextClient = this.modes[mode];
                            }

                            this.mode = mode;

                            if (prevClient) {
                                this.hideClient(prevClient);
                            }

                            if (nextClient) {
                                this.showClient(nextClient);
                            }
                        }
                    }

                    return this;
                }

                showClient(clientElement) {
                    clientElement.setStyle({
                        display: 'table',
                        opacity: '0.1',
                    });

                    setTimeout(() => {
                        clientElement.setStyle({ opacity: '1.0' });
                        clientElement.autofocus();
                    }, 20);

                    return this;
                }

                [Symbol.iterator]() {
                    return Object.keys(this.modes)[Symbol.iterator]();
                }
            }
        </script>
