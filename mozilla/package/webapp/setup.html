<!DOCTYPE bundle>
<bundle>
    <widget tagname="setup-app">
        <script type="settings">
            {
                "type": "app",
                "title": "##setup##",
                "path": "setupPath",
                "width": 700,
                "horzMode": "maxx"
            }
        </script>
        <script>
            class SetupApp extends Widget {
                onCertifyHost(response) {
                    if (Object.Type.verify(response.result) && response.result.type == 'websocket') {
                        showDialog(
                            'close',
                            createElement(
                                'progress-widget',
                                {
                                    'rds-websocket-path': response.result.path,
                                }
                            )
                        );
                    }
                }

                onConfigureDbms(response) {
                    if (response.result === true) {
                        Controller.setValue('setupState', response.result);
                    }
                    else {
                        alert('error message on Form....');
                    }
                }

                onSetSystemMode(response) {
                    if (response.result) {
                        Controller.setValue('setupState', response.result);
                    }
                }
            }
        </script>
        <html>
            <selector-panel class="fill" rds-bind="setupState">
                <form-widget class="fill" rds-mode="setup#acme" rds-action="certifyHost,acme">
                    <div class="h1">##acmeCertify##</div>
                    <data-widget rds-bind="acme" rds-readonly="false"></data-widget>
                    <formbuttons-widget></formbuttons-widget>
                </form-widget>
                <form-widget class="fill-horz" rds-mode="setup#mode" rds-action="setSystemMode,systemMode">
                    <div class="h1">##selectmode##</div>
                    <fieldset-widget rds-bind="systemMode" evt-input="yield">
                        [
                            { "value": "system#standalone", "text": "##standalone##" },
                            { "value": "system#serverteam", "text": "##serverteam##" }
                        ]
                    </fieldset-widget>
                </form-widget>
                <form-widget class="fill-horz" rds-mode="setup#dbms" rds-action="configureDbms,dbms">
                    <div class="h1">##configureDbms##</div>
                    <data-widget rds-bind="dbms" rds-readonly="false"></data-widget>
                    <formbuttons-widget></formbuttons-widget>
                </form-widget>
                <form-widget class="fill-horz" rds-mode="setup#emailer" rds-action="configureEmailer,emailer">
                    *** emailer ***
                </form-widget>
                <form-widget class="fill-horz" rds-mode="setup#user" rds-action="configureUser,user">
                    *** user ***
                </form-widget>
                <form-widget class="fill-horz" rds-mode="setup#user" rds-action="configureServerTeam,serverteam">
                    *** serverteam ***
                </form-widget>
            </selector-panel>
        </html>
    </widget>
</bundle>
