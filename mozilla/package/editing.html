    <widget tagname="array-widget">
        <script type="settings">
            {
                "substitute": "table"
            }

        <script>
            class ArrayWidget extends EditingWidget {
                init() {
                    super.init();
                    this.render();
                }

                onReadonlyChanged() {
                }

                onStartEditing() {
                }

                onStopEditing() {
                }

                render() {
                    this.clear();
                    let shape = this.getShape();
                    let clss = shape.getClass();
                    let readonly = this.isReadonly();
                    this.setClassName('array-widget');

                    this.append(
                        this.tbody = createElement('tbody', {
                            class: 'array-widget-body',
                        })
                    );

                    for (let i = 0; i < Controller.getValue(this.getDotted()).length; i++) {
                        let dotted = `${this.getDotted()}.${i}`;

                        this.tbody.append(
                            createElement('arrayrow-widget', {
                                'rds-bind': dotted,
                                'rds-readonly': readonly,
                            })
                        );
                    }
                }
            }
        </script>

    <widget tagname="arrayrow-widget">
        <script type="settings">
            {
                "substitute": "tr"
            }
        </script>
        <script>
            class ArrayRowWidget extends EditingWidget {
                init() {
                    super.init();
                    this.render();
                }

                onReadonlyChanged() {
                }

                onStartEditing() {
                }

                onStopEditing() {
                }

                render() {
                    this.clear();
                    let shape = this.getShape();
                    let readonly = this.isReadonly();
                    this.setClassName('arrayrow-widget');

                    if (shape.getType() === ObjectType) {
                        for (let property in shape) {
                            let dotted = `${this.getDotted()}.${property}`;

                            this.append(
                                createElement('td', {
                                    class: 'arrayrow-widget-cell',
                                }).append(
                                    createElement('data-widget', {
                                        'rds-bind': dotted,
                                        'rds-readonly': readonly,
                                    })
                                )
                            );
                        }
                    }
                    else {
                        this.append(
                            createElement('td', {
                                class: 'arrayrow-widget-cell',
                            }).append(
                                createElement('data-widget', {
                                    'rds-bind': this.getDotted(),
                                    'rds-readonly': readonly,
                                })
                            )
                        );
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="data-widget">
        <script>
            class DataWidget extends EditingWidget {
                init() {
                    super.init();

                    if (this.getDotted()) {
                        let attributes = {
                            'rds-bind': this.getDotted(),
                            'rds-readonly': `${this.isReadonly()}`,
                        };

                        for (let attribute of this.getAttributes()) {
                            if (!(attribute.name in { 'rds-bind':0, 'rds-readonly':0 })) {
                                attributes[attribute.name] = attribute.value;
                            }
                        }

                        if (this.shape.getType() === ArrayType) {
                            let widget = createElement('array-widget', attributes);
                            this.replace(widget);
                        }
                        else if (this.shape.getType() === ObjectType) {
                            let widget = createElement('object-widget', attributes);
                            this.replace(widget);
                        }
                        else {
                            let widget = createElement('scalar-widget', attributes);
                            this.replace(widget);
                        }
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="fieldset-widget">
        <script type="settings">
            {
                "substitute": "fieldset"
            }
        </script>
        <script>
            class FieldsetWidget extends Widget {
                init() {
                    this.setClassName('input-widget-radio-fieldset');
                    let options;

                    try {
                        if (!this.getRdsBindOptions) {
                            options = fromJson(this.getInnerHtml().trim());
                        }
                    }
                    catch (e) {}

                    if (this.getRdsBind) {
                        this.boundTo = this.getRdsBind();
                        delete this.getRdsBind;
                    }

                    if (this.getRdsLegend || this.getRdsBindLegend) {
                        this.legend = createElement('legend', {
                            class: 'input-widget-radio-legend',
                        });

                        if (this.getRdsLegend) {
                            this.legend.setInnerHtml(this.getRdsLegend());
                        }
                        else {
                            Controller.bindInner(this.legend, this.getRdsBindLegend())
                        }
                    }

                    if (options) {
                        this.setOptions(options);
                    }

                    super.init();
                }

                resetValue() {
                    if (this.boundTo) {
                        let value = Controller.getValue(this.boundTo);

                        for (let child of this.getChildElements()) {
                            if (!this.legend || !Object.is(child, this.legend)) {
                                if (child.getChildElementAt(0).getAttribute('value') == value) {
                                    return;
                                }
                            }
                        }

                        Controller.setValue(this.boundTo, '');
                    }
                }

                setOptions(options) {
                    this.clear();

                    if (this.legend) {
                        this.append(this.legend);
                    }

                    let attributes = {
                        id: '',
                        type: 'radio',
                        name: '',
                        class: 'input-widget-radio',
                    };

                    if (this.boundTo) {
                        attributes.name = this.boundTo;
                        attributes['rds-bind'] = this.boundTo;
                    }

                    for (let option of options) {
                        attributes.id = Crypto.generateUUID();
                        attributes.value = option.value;

                        this.append(
                            createElement('div', {
                                class: 'input-widget-radio-div',
                            })
                            .append(
                                createElement('input', attributes),
                                mkHtmlElement('label', {
                                    for: attributes.id,
                                    class: 'input-widget-radio-label',
                                })
                                .setInnerHtml(option.text),
                            )
                        );
                    }

                    this.resetValue();
                    return this;
                }
            }
        </script>
    </widget>

    <widget tagname="object-widget">
        <script type="settings">
            {
                "substitute": "table"
            }
        </script>
        <script>
            class ObjectWidget extends EditingWidget {
                init() {
                    super.init();
                    this.setClassName('object-widget');
                    this.render();

                }

                onReadonlyChanged() {
                }

                onStartEditing() {
                }

                onStopEditing() {
                }

                render() {
                    this.clear();
                    let shape = this.getShape();
                    let readonly = this.isReadonly();
                    this.setClassName('object-widget');

                    this.append(
                        this.tbody = createElement('tbody', {
                            class: 'object-widget-body',
                        })
                    );

                    for (let property of shape) {
                        let dotted = `${this.getDotted()}.${property}`;
                        let propertyClassName;

                        if (shape.isOptional(property)) {
                            propertyClassName = 'object-widget-optional-property';
                        }
                        else {
                            propertyClassName = 'object-widget-property';
                        }

                        this.tbody.append(
                            createElement('tr')
                            .append(
                                createElement('td', {
                                    class: propertyClassName,
                                })
                                .setInnerHtml(property),

                                createElement('td', {
                                    class: 'object-widget-value',
                                })
                                .append(
                                    createElement('data-widget', {
                                        'rds-bind': dotted,
                                        'rds-readonly': readonly,
                                    })
                                )
                            )
                        );
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="scalar-widget">
        <script>
            class ScalarWidget extends EditingWidget {
                static inputTypes = new WeakMap();

                static {
                    ScalarWidget.inputTypes.set(BigIntType, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(BooleanType, { tagName: 'toggle-widget' });
                    //ScalarWidget.inputTypes.set(ColorType, { tagName: 'input-widget', type: 'color' });
                    ScalarWidget.inputTypes.set(DateType, { tagName: 'input-widget', type: 'date' });
                    ScalarWidget.inputTypes.set(DateTimeType, { tagName: 'input-widget', type: 'datetime-local' });
                    ScalarWidget.inputTypes.set(DoubleType, { tagName: 'input-widget', type: 'number' });
                    //ScalarWidget.inputTypes.set(EmailType, { tagName: 'input-widget', type: 'email' });
                    ScalarWidget.inputTypes.set(NumberType, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(NumericType, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(RegexType, { tagName: 'input-widget', type: 'string' });
                    ScalarWidget.inputTypes.set(Float32Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(Float64Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(Int8Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(Int16Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(Int32Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(Int64Type, { tagName: 'input-widget', type: 'number' });
                    //ScalarWidget.inputTypes.set(PasswordType, { tagName: 'input-widget', type: 'password' });
                    ScalarWidget.inputTypes.set(RdsEnum, { tagName: 'select-widget' });
                    //ScalarWidget.inputTypes.set(TelephoneType, { tagName: 'input-widget', type: 'tel' });
                    ScalarWidget.inputTypes.set(StringType, { tagName: 'input-widget', type: 'text' });
                    ScalarWidget.inputTypes.set(UInt8Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(UInt16Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(UInt32Type, { tagName: 'input-widget', type: 'number' });
                    ScalarWidget.inputTypes.set(UInt64Type, { tagName: 'input-widget', type: 'number' });
                    //ScalarWidget.inputTypes.set(UrlType, { tagName: 'input-widget', type: 'url' });
                }

                init() {
                    super.init();
                    this.setClassName('scalar-widget');

                    this.append(
                        this.viewer = createElement('div', {
                            class: 'scalar-widget-viewer',
                            'rds-bind': this.getDotted(),
                        })
                    );

                    if (ScalarWidget.inputTypes.has(this.getShape().getType())) {
                        this.inputType = ScalarWidget.inputTypes.get(this.getShape().getType());

                        if (this.inputType.tagName == 'input-widget') {
                            this.editor = createElement(this.inputType.tagName, {
                                type: this.inputType.type,
                                'rds-bind': this.getDotted(),
                            });
                        }
                        else {
                            this.editor = createElement(this.inputType.tagName, {
                                'rds-bind': this.getDotted(),
                            });
                        }
                    }

                    this.onReadonlyChanged();

                    (async () => {
                        await pause(2000);
                        Controller.setValue('acme.operator.org', 'Bob Loblaw');
                    });
                }

                onHandleEventClick(event) {
                    if (!this.isEditing()) {
                        this.startEdit();
                    }
                }

                onInspectEventKeydown(event) {
                    if (event.getKey() == 'Escape') {
                        this.stopEdit();
                    }
                    else if (event.getKey() == 'Enter') {
                        this.stopEdit();
                    }
                    else {
                        return RdsEvent.propagate;
                    }
                }

                onReadonlyChanged() {
                    if (this.inputType) {
                        if (this.isReadonly()) {
                            this.viewer.clearClassName('responsive');
                        }
                        else {
                            this.viewer.setClassName('responsive');
                        }
                    }
                }

                onStartEditing() {
                    this.viewer.replace(this.editor);
                    this.editor.focus();
                }

                onStopEditing() {
                    this.editor.replace(this.viewer);
                }
            }
        </script>
    </widget>

    <widget tagname="select-widget">
        <script type="settings">
            {
                "substitute": "select"
            }
        </script>
        <script>
            class SelectWidget extends Widget {
                createOptionElement(option) {
                    let optionElement = createElement('option', {
                        value: option.value,
                        class: 'input-widget-select-option',
                    });

                    let innerElements;

                    if (option.shape) {
                        innerElements = [
                            createElement('span').setInnerHtml(option.text.trim()),
                            createElement('span', {
                                class: 'input-widget-select-option-svg',
                            })
                            .append(
                                createElement('svg', {
                                    class: 'icon icon-small',
                                    'rds-shape': option.shape,
                                })
                            )
                        ];
                    }
                    else if (option.icon) {
                        // TODO **************
                        // BINARY IMAGE, NOT AN SVG
                        innerElements = [];
                    }
                    else {
                        innerElements = [
                            createElement('span').setInnerHtml(option.text.trim()),
                            createElement('span', {
                                class: 'input-widget-select-option-svg',
                            })
                        ];
                    }
                    
                    return optionElement.append(...innerElements);
                }

                init() {
                    this.setClassName('input-widget-select');

                    try {
                        if (!this.getRdsBindOptions) {
                            let options = fromJson(this.getInnerHtml().trim());
                            this.setOptions(options);
                        }
                    }
                    catch (e) {}
                    super.init();
                    this.once('focusin', message => SelectWidget.layoutSelect(this));
                }

                static layoutSelect(selectWidget) {
                    let maxWidth = 0;
                    let hasSvg = false;

                    for (let option of selectWidget.getChildElements()) {
                        let text = option.getChildElementAt(0);
                        let svg = option.getChildElementAt(1);
                        
                        if (text.getClientWidth() > maxWidth) {
                            maxWidth = text.getClientWidth();
                        }

                        if (svg.getChildElements().length) {
                            hasSvg = true;
                        }
                    }

                    for (let option of selectWidget.getChildElements()) {
                        option.getChildElementAt(0).setStyle({ width: `${maxWidth+10}px` });
                    }

                    if (!hasSvg) {
                        for (let option of selectWidget.getChildElements()) {
                            option.getChildElementAt(1).setStyle({ width: '0px' });
                        }
                    }
                }

                setOptions(options) {
                    this.clear();
                    let value;
                    let boundTo = this.getRdsBind();
                    let reset = true;

                    if (this.getRdsBind) {
                        value = Controller.getValue(boundTo);
                    }
                    else {
                        reset = false;
                    }

                    for (let option of options) {
                        this.append(this.createOptionElement(option));

                        if (value && option.value == value) {
                            reset = false;
                        }
                    }

                    if (reset) {
                        Controller.setValue(boundTo, '');
                    }

                    return this;
                }
            }
        </script>
    </widget>

    <widget tagname="toggle-widget">
        <script>
            class ToggleWidget extends Widget {
                getChecked() {
                    return this.checkbox.getProperty('checked');
                }

                init() {
                    this.checkbox = this.getChildElementAt(0);
                    this.knob = this.getChildElementAt(1);

                    if (this.getRdsBind) {
                        this.dotted = this.getRdsBind();
                        delete this.getRdsBind;
                        Controller.bindMethod(this, 'setChecked', this.dotted);
                    }

                    if (this.dotted) {
                        Controller.bindInput(this.checkbox, this.dotted);

                        Controller.on('Set', message => {
                            if (message.dotted == this.dotted) {
                                this.update();
                            }
                        });
                    }

                    this.setStyle('transition-delay', '.45s');
                    this.knob.setStyle('transition-duration', '.45s');
                    this.update();
                    
                    this.on('click', message => {
                        if (!this.hasAttribute('disabled')) {
                            let checked = !this.getChecked();
                            Controller.setValue(this.dotted, checked);
                        }
                    });
                    
                    Doc.on('Attr-Mutation', message => {
                        if (this.isSame(message.target)) {
                            if (message.attributeName == 'disabled') {
                                this.update();
                            }
                        }
                    });

                    super.init();
                }

                setChecked(checked) {
                    if (checked != this.getChecked()) {
                        this.checkbox.setProperty('checked', checked);
                        this.update();
                    }

                    return this;
                }

                update() {
                    if (this.checkbox.getProperty('checked')) {
                        this.clearClassName('toggle-widget-unselected');
                        this.knob.clearClassName('toggle-widget-knob-unselected');
                        this.setClassName('toggle-widget-selected');
                        this.knob.setClassName('toggle-widget-knob-selected');
                    }
                    else {
                        this.clearClassName('toggle-widget-selected');
                        this.knob.clearClassName('toggle-widget-knob-selected');
                        this.setClassName('toggle-widget-unselected');
                        this.knob.setClassName('toggle-widget-knob-unselected');
                    }

                    if (this.hasAttribute('disabled')) {
                        this.setClassName('disabled');
                    }
                    else {
                        this.clearClassName('disabled');
                    }
                }
            }
        </script>
        <html>
            <input type="checkbox" style="display:none;">
            <svg rds-shape="circle"></svg>
        </html>
    </widget>
