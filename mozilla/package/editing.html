    <widget tagname="data-widget">
        <script>
            class DataWidget extends Widget {
                static categories = mkRdsEnum(
                    '#ARRAY',
                    '#PROPERTY',
                    '#SCALAR',
                );

                init() {
                    super.init();

                    this.editingArray = null;
                    this.editingScalar = null;
                    this.readonly = this.getRdsReadOnly ? true : false;

                    if (!this.getRdsBind) return;
                    this.dotted = this.getRdsBind();
                    delete this.getRdsBind;

                    this.setClassName('data-widget-tile');
                    this.render();
                }

                static editArray(tile) {
                    // ***************************************************
                    // ***************************************************
                }

                static editScalar(tile) {
                    // ***************************************************
                    // ***************************************************
                }

                getReadOnly() {
                    return this.readonly;
                }

                onEventClick(message) {
                    console.log('** Click');
                    console.log(message);
                }
                
                onEventScalar(message) {
                    console.log('** Scalar');
                    console.log(message);
                }

                pushToRendered(opts, tile, category) {
                    if (DataWidget.categories.has(category)) {
                        let rendered = {
                            dotted: opts.dotted,
                            shape: opts.shape,
                            tile: tile,
                            category: category,
                        };

                        this.rendered.push(rendered);
                    }

                    return this;
                }

                render() {
                    this.clear();
                    this.rendered = [];

                    this.renderValue({
                        tile: this,
                        dotted: this.dotted,
                        shape: Controller.getShape(this.dotted),
                    });

                    this.updateEditability();
                }

                renderArray(opts) {
                    // ***************************************************
                    // ***************************************************
                    console.log('render ArrayType');
                }

                renderBoolean(opts) {
                    // ***************************************************
                    // ***************************************************
                    console.log('render BooleanType');
                }

                renderDate(opts) {
                    // ***************************************************
                    // ***************************************************
                    console.log('render DateType');
                }

                renderNumber(opts) {
                    opts.tile.setClassName('data-widget-number');
                    Controller.bindInner(opts.tile, opts.dotted);
                    this.pushToRendered(opts, opts.tile, '#SCALAR');
                }

                renderObject(opts) {
                    let table = createElementFromOuterHtml(
                        `<table class="data-widget-object">
                            <tbody class="data-widget-object-body"></tbody>
                        </table>`
                    );

                    opts.tile.append(table);
                    let tbody = table.getChildElementAt(0);

                    for (let property of opts.shape) {
                        let row;

                        if (opts.shape.isOptional(property)) {
                            row = createElementFromOuterHtml(
                                `<tr>
                                    <td class="data-widget-object-property-optional">${property}</td>
                                    <td></td>
                                </tr>`
                            );
                        }
                        else {
                            row = createElementFromOuterHtml(
                                `<tr>
                                    <td class="data-widget-object-property">${property}</td>
                                    <td></td>
                                </tr>`
                            );
                        }

                        if (Controller.getValue(opts.dotted)) {
                            this.renderValue({
                                tile: row.getChildElementAt(1),
                                dotted: `${opts.dotted}.${property}`,
                                shape: opts.shape.get(property),
                            });
                        }

                        this.pushToRendered(opts, row.getChildElementAt(0), '#PROPERTY');
                        tbody.append(row);
                    }
                }

                renderRegex(opts) {
                    // ***************************************************
                    // ***************************************************
                    console.log('render RegexType');
                }

                renderString(opts) {
                    opts.tile.setClassName('data-widget-string');
                    Controller.bindInner(opts.tile, opts.dotted);
                    this.pushToRendered(opts, opts.tile, '#SCALAR');
                }

                renderValue(opts) {
                    if (opts.shape.getType() == ArrayType) {
                        this.renderArray(opts);
                    }
                    else if (opts.shape.getType() == BooleanType) {
                        this.renderBoolean(opts);
                    }
                    else if (opts.shape.getType() == DateType) {
                        this.renderDate(opts);
                    }
                    else if (opts.shape.getType() == NumberType) {
                        this.renderNumber(opts);
                    }
                    else if (opts.shape.getType() == ObjectType) {
                        this.renderObject(opts);
                    }
                    else if (opts.shape.getType() == RegexType) {
                        this.renderRegex(opts);
                    }
                    else if (opts.shape.getType() == StringType) {
                        this.renderString(opts);
                    }
                }

                setReadOnly(readonly) {
                    if (BooleanType.verify(readonly)) {
                        if (readonly != this.readonly) {
                            this.readonly = readonly;
                            this.updateEditability();
                        }
                    }

                    return this;
                }

                updateEditability() {
                    for (let rendered of this.rendered) {
                        if (rendered.category == '#ARRAY') {
                            if (this.readonly) {
                            }
                            else {
                            }
                        }
                        else if (rendered.category == '#PROPERTY') {
                            if (this.readonly) {
                            }
                            else if (rendered.shape.isOptional()) {
                                // rendered.tile.append(some-sort-of-svg);
                                rendered.tile.setClassName('data-widget-actionable');
                            }
                        }
                        else if (rendered.category == '#SCALAR') {
                            if (this.readonly) {

                            else {
                                Controller.setEventAlias(rendered.tile, 'click', 'scalar');
                                rendered.tile.setClassName('data-widget-actionable');

    <widget tagname="fieldset-widget">
        <script type="settings">
            {
                "substitute": "fieldset"
            }
        </script>
        <script>
            class FieldsetWidget extends Widget {
                init() {
                    this.setClassName('input-widget-radio-fieldset');
                    let options;

                    try {
                        if (!this.getRdsBindOptions) {
                            options = fromJson(this.getInnerHtml().trim());
                        }
                    }
                    catch (e) {}

                    if (this.getRdsBind) {
                        this.boundTo = this.getRdsBind();
                        delete this.getRdsBind;
                    }

                    if (this.getRdsLegend || this.getRdsBindLegend) {
                        this.legend = createElement('legend', {
                            class: 'input-widget-radio-legend',
                        });

                        if (this.getRdsLegend) {
                            this.legend.setInnerHtml(this.getRdsLegend());
                        }
                        else {
                            Controller.bindInner(this.legend, this.getRdsBindLegend())
                        }
                    }

                    if (options) {
                        this.setOptions(options);
                    }

                    super.init();
                }

                resetValue() {
                    if (this.boundTo) {
                        let value = Controller.getValue(this.boundTo);

                        for (let child of this.getChildElements()) {
                            if (!this.legend || !Object.is(child, this.legend)) {
                                if (child.getChildElementAt(0).getAttribute('value') == value) {
                                    return;
                                }
                            }
                        }

                        Controller.setValue(this.boundTo, '');
                    }
                }

                setOptions(options) {
                    this.clear();

                    if (this.legend) {
                        this.append(this.legend);
                    }

                    let attributes = {
                        id: '',
                        type: 'radio',
                        name: '',
                        class: 'input-widget-radio',
                    };

                    if (this.boundTo) {
                        attributes.name = this.boundTo;
                        attributes['rds-bind'] = this.boundTo;
                    }

                    for (let option of options) {
                        attributes.id = Crypto.generateUUID();
                        attributes.value = option.value;

                        this.append(
                            createElement('div', {
                                class: 'input-widget-radio-div',
                            })
                            .append(
                                createElement('input', attributes),
                                mkHtmlElement('label', {
                                    for: attributes.id,
                                    class: 'input-widget-radio-label',
                                })
                                .setInnerHtml(option.text),
                            )
                        );
                    }

                    this.resetValue();
                    return this;
                }
            }
        </script>

    <widget tagname="select-widget">
        <script type="settings">
            {
                "substitute": "select"
            }
        </script>
        <script>
            class SelectWidget extends Widget {
                createOptionElement(option) {
                    let optionElement = createElement('option', {
                        value: option.value,
                        class: 'input-widget-select-option',
                    });

                    let innerElements;

                    if (option.shape) {
                        innerElements = createElementFromOuterHtml(
                            `<span>${option.text.trim()}</span>` +
                            `<span class="input-widget-select-option-svg"><svg class="icon icon-small" rds-shape="${option.shape}"></svg></span>`
                        );
                    }
                    else if (option.icon) {
                        /*
                        innerElements = createElementFromOuterHtml(
                            `<span>${option.text.trim()}</span>` +
                            `<span class="input-widget-select-option-svg"><svg class="icon icon-small" rds-shape="${opt.shape}"></svg></span>`
                        );
                        */
                    }
                    else {
                        innerElements = createElementFromOuterHtml(
                            `<span>${option.text.trim()}</span>` +
                            `<span class="input-widget-select-option-svg"></span>`
                        );
                    }
                    
                    return optionElement.append(...innerElements);
                }

                init() {
                    this.setClassName('input-widget-select');

                    try {
                        if (!this.getRdsBindOptions) {
                            let options = fromJson(this.getInnerHtml().trim());
                            this.setOptions(options);
                        }
                    }
                    catch (e) {}
                    super.init();
                    this.once('focusin', message => SelectWidget.layoutSelect(this));
                }

                static layoutSelect(selectWidget) {
                    let maxWidth = 0;
                    let hasSvg = false;

                    for (let option of selectWidget.getChildElements()) {
                        let text = option.getChildElementAt(0);
                        let svg = option.getChildElementAt(1);
                        
                        if (text.getClientWidth() > maxWidth) {
                            maxWidth = text.getClientWidth();
                        }

                        if (svg.getChildElements().length) {
                            hasSvg = true;
                        }
                    }

                    for (let option of selectWidget.getChildElements()) {
                        option.getChildElementAt(0).setStyle({ width: `${maxWidth+10}px` });
                    }

                    if (!hasSvg) {
                        for (let option of selectWidget.getChildElements()) {
                            option.getChildElementAt(1).setStyle({ width: '0px' });
                        }
                    }
                }

                setOptions(options) {
                    this.clear();
                    let value;
                    let boundTo = this.getRdsBind();
                    let reset = true;

                    if (this.getRdsBind) {
                        value = Controller.getValue(boundTo);
                    }
                    else {
                        reset = false;
                    }

                    for (let option of options) {
                        this.append(this.createOptionElement(option));

                        if (value && option.value == value) {
                            reset = false;
                        }
                    }

                    if (reset) {
                        Controller.setValue(boundTo, '');
                    }

                    return this;
                }
            }
        </script>
    </widget>

    <widget tagname="toggle-widget">
        <script>
            class ToggleWidget extends Widget {
                getChecked() {
                    return this.checkbox.getProperty('checked');
                }

                init() {
                    this.checkbox = this.getChildElementAt(0);
                    this.knob = this.getChildElementAt(1);

                    if (this.getRdsBind) {
                        this.dotted = this.getRdsBind();
                        delete this.getRdsBind;
                        Controller.bindMethod(this, 'setChecked', this.dotted);
                    }

                    if (this.dotted) {
                        Controller.bindInput(this.checkbox, this.dotted);

                        Controller.on('Set', message => {
                            if (message.dotted == this.dotted) {
                                this.update();
                            }
                        });
                    }

                    this.setStyle('transition-delay', '.45s');
                    this.knob.setStyle('transition-duration', '.45s');
                    this.update();
                    
                    this.on('click', message => {
                        if (!this.hasAttribute('disabled')) {
                            let checked = !this.getChecked();
                            Controller.setValue(this.dotted, checked);
                        }
                    });
                    
                    Doc.on('Attr-Mutation', message => {
                        if (this.isSame(message.target)) {
                            if (message.attributeName == 'disabled') {
                                this.update();
                            }
                        }
                    });

                    super.init();
                }

                setChecked(checked) {
                    if (checked != this.getChecked()) {
                        this.checkbox.setProperty('checked', checked);
                        this.update();
                    }

                    return this;
                }

                update() {
                    if (this.checkbox.getProperty('checked')) {
                        this.clearClassName('toggle-widget-unselected');
                        this.knob.clearClassName('toggle-widget-knob-unselected');
                        this.setClassName('toggle-widget-selected');
                        this.knob.setClassName('toggle-widget-knob-selected');
                    }
                    else {
                        this.clearClassName('toggle-widget-selected');
                        this.knob.clearClassName('toggle-widget-knob-selected');
                        this.setClassName('toggle-widget-unselected');
                        this.knob.setClassName('toggle-widget-knob-unselected');
                    }

                    if (this.hasAttribute('disabled')) {
                        this.setClassName('disabled');
                    }
                    else {
                        this.clearClassName('disabled');
                    }
                }
            }
        </script>
        <html>
            <input type="checkbox" style="display:none;">
            <svg rds-shape="circle"></svg>
        </html>
    </widget>
