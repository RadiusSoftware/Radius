    <widget tagname="main-panel">
        <script>
            class MainPanel extends Widget {
                configureFillMode() {
                    this.setAttribute('horzmode', 'fill');
                    this.clear().append(appWidget);
                }

                configureMaxxMode() {
                    if (appWidget.hasSetting('width')) {
                        this.maxWidth = appWidget.getSetting('width');

                        if (!NumberType.verify(this.maxWidth)) {
                            delete this.maxWidth;
                        }
                    }

                    if (!this.maxWidth) {
                        this.maxWidth = 800;
                    }

                    this.setStyle({
                        display: 'flex',
                        flexDirection: 'row',
                        justifyContent: 'center',
                        alignItems: 'top',
                    });
                    
                    this.append(
                        appWidget.setStyle({
                            width: '100%',
                            maxWidth: `${this.maxWidth}px`,
                        })
                    );
                }

                getHorzCategory() {
                    return this.horzCategory;
                }

                init() {
                    globalThis.mainPanel = this;
                    this.horzFixedWidth = 600;

                    const setHorzCategory = winWidth => {
                        if (winWidth >= this.horzFixedWidth) {
                            this.horzCategory = 'standard';
                        }
                        else {
                            this.horzCategory = 'small';
                        }
                    }

                    setHorzCategory(Win.getInnerWidth());

                    Win.on('EventResize', message => {
                        let horzCategory = this.horzCategory;
                        let winWidth = Win.getInnerWidth();
                        setHorzCategory(winWidth);

                        if (this.horzCategory != horzCategory) {
                            this.emit({
                                name: 'HorzCategory',
                                category: this.horzCategory,
                                width: winWidth,
                            });
                        }
                    });

                    super.init();
                    this.setClassName('main-panel');

                    if (appWidget.hasSetting('style')) {
                        appWidget.setStyle(appWidget.getSetting('style'));
                    }
                    else {
                        appWidget.setStyle({
                            display: 'block',
                            boxSizing: 'border-box',
                            margin: '0px',
                            padding: '0px',
                        });
                    }

                    if (appWidget.hasSetting('horzMode')) {
                        let horzMode = appWidget.getSetting('horzMode');
                        let methodName = `configure${horzMode[0].toUpperCase()}${horzMode.substring(1)}Mode`;

                        if (FunctionType.verify(this[methodName])) {
                            this.setAttribute('horzmode', horzMode);
                            this[methodName]();
                        }
                        else {
                            this.setAttribute('horzmode', 'fill');
                            this.configureFillMode();
                        }
                    }
                    else {
                        this.setAttribute('horzmode', 'fill');
                        this.configureFillMode();
                    }
                }
            }
        </script>
    </widget>

    <widget tagname="selector-panel">
        <script>
            class SelectorPanel extends Widget {
                configureClientElement(clientElement) {
                    clientElement.setProperty('prevStyleSettings', clientElement.getStyle());

                    clientElement.setStyle({
                        display: 'none',
                        width: '100%',
                        height: '100%',
                        transitionProperty: 'opacity',
                        transitionDuration: `${this.duration}s`,
                    });

                    this.append(clientElement);
                    return this;
                }

                deconfigureClientElement(clientElement) {
                    clientElement.remove();
                    clientElement.setStyle(clientElement.getProperty('prevStyleSettings'));
                    clientElement.deleteProperty('prevStyleSettings');
                }

                getMode() {
                    return this.mode;
                }

                getModeClient(mode) {
                    return mode in this.modes ? this.modes[mode].client : null;
                }

                hasMode(mode) {
                    return mode in this.modes;
                }

                hideClient(clientElement) {
                    clientElement.setStyle({
                        display: 'none',
                        opacity: '.1',
                    });

                    return this;
                }

                init() {
                    this.mode = '';
                    this.modes = {};
                    this.clients = new WeakMap();
                    this.duration = .5;
                    super.init();

                    if (this.getRdsDuration) {
                        this.duration = parseFloat(this.getRdsDuration());
                    }
                    
                    for (let clientElement of this.getChildElements()) {
                        if (clientElement instanceof DocElement) {
                            if (typeof clientElement.getRdsMode == 'function') {
                                this.setClientElement(clientElement.getRdsMode(), clientElement);
                            }
                            else {
                                clientElement.remove();
                            }
                        }
                    }
                }

                listClients() {
                    let clients = [];
                    let clientMap = new WeakMap();

                    for (let mode in this.modes) {
                        clients.push(this.modes[mode]);
                    }

                    return clients;
                }

                listModes() {
                    return Object.keys(this.modes);
                }

                removeClient(clientElement) {
                    if (this.clients.has(clientElement)) {
                        let mode = this.clients.get(clientElement);
                        this.deconfigureClientElement(clientElement);
                        delete this.modes[mode];
                        this.clients.delete(clientElement);

                        if (mode == this.mode) {
                            this.mode = '';
                        }
                    }

                    return this;
                }

                removeMode(mode) {
                    if (mode in this.modes) {
                        let clientElement = this.modes[mode];
                        this.deconfigureClientElement(clientElement);
                        delete this.modes[mode];
                        this.clients.delete(clientElement);

                        if (mode == this.mode) {
                            this.mode = '';
                        }
                    }

                    return this;
                }

                removeModes() {
                    for (let mode of this.modes) {
                        this.deconfigure(this.modes[mode]);
                    }

                    this.clear();
                    this.mode = '';
                    this.modes = {};
                    this.clients = new WeakMap();
                    return this;
                }

                replaceClient(clientElement, newClientElement) {
                    if (clientElement instanceof DocElement && newClientElement instanceof DocElement) {
                        if (!clientElement.isSame(newClientElement)) {
                            if (this.clients.has(clientElement) && !this.clients.has(newClientElement)) {
                                let mode = this.clients.get(clientElement);
                                this.clients.delete(clientElement);
                                this.clients.set(newClientElement, mode);
                                this.modes[mode] = newClientElement;
                                this.deconfigureClientElement(clientElement);
                                this.configureClientElement(newClientElement);

                                if (mode == this.mode) {
                                    this.showClient(newClientElement);
                                }
                            }
                        }
                    }

                    return this;
                }

                resetMode() {
                    if (this.mode && this.mode in this.modes) {
                        this.hideClient(this.modes[this.mode]);
                    }

                    this.mode = '';
                    return this;
                }

                setClientElement(mode, clientElement) {
                    if (this.clients.has(clientElement)) {
                        let clientMode = this.clients.get(clientElement);

                        if (mode != clientMode) {
                            if (this.mode == clientMode) {
                                this.hideClient(clientElement);
                            }

                            delete this.modes[clientMode];
                            this.modes[mode] = clientElement;
                            this.clients.set(clientElement, mode);

                            if (this.mode == mode) {
                                this.showClient(clientElement);
                            }
                        }
                    }
                    else {
                        this.configureClientElement(clientElement);

                        if (mode in this.modes) {
                            if (!clientElement.isSame(this.modes[mode])) {
                                this.replaceClient(this.modes[mode], clientElement);
                            }
                        }
                        else {
                            this.modes[mode] = clientElement;
                            this.clients.set(clientElement, mode);

                            if (mode == this.mode) {
                                this.showClient(clientElement);
                            }
                        }
                    }
                    
                    return this;
                }

                setMode(mode) {
                    if (typeof mode == 'string' && (mode = mode.trim())) {
                        if (mode != this.mode) {
                            let prevClient;
                            let nextClient;

                            if (this.mode in this.modes) {
                                prevClient = this.modes[this.mode];
                            }

                            if (mode in this.modes) {
                                nextClient = this.modes[mode];
                            }

                            this.mode = mode;

                            if (prevClient) {
                                this.hideClient(prevClient);
                            }

                            if (nextClient) {
                                this.showClient(nextClient);
                            }
                        }
                    }

                    return this;
                }

                showClient(clientElement) {
                    clientElement.setStyle({
                        display: 'table',
                        opacity: '0.1',
                    });

                    setTimeout(() => {
                        clientElement.setStyle({ opacity: '1.0' });
                        clientElement.autofocus();
                    }, 20);

                    return this;
                }

                [Symbol.iterator]() {
                    return Object.keys(this.modes)[Symbol.iterator]();
                }
            }
        </script>
