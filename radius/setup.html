<!DOCTYPE httpx>
<bundle>
    <widget tagname="setup-app">
        <script type="settings">
            {
                "type": "app",
                "title": "##setup##",
                "path": "setupPath",
                "horzMode": "fill",
                "style": {
                    "display": "block",
                    "boxSizing": "border-box",
                    "margin": "0px",
                    "padding": "0px"
                }
            }
        </script>
        <script>
            class SetupApp extends Widget {
                onCertifyHost(response) {
                    if (response.result && response.result.type == 'websocket') {
                        showDialog('close', '700px', '400px', 
                            createElement(
                                'progress-widget',
                                {
                                    'rds-websocket-path': response.result.path,
                                }
                            )
                        );
                    }
                }

                onConfigureMode(response) {
                    // *********************************************************************************
                    // *********************************************************************************
                }
            }
        </script>
        <html>
            <selector-panel class="fill" rds-bind="setupState">
                <form-widget class="fill" rds-mode="setup#acme" rds-action="certifyHost,acme">
                    <grid-widget class="fill" rds-rows="50px,auto,50px" rds-cols="50px,auto,50px">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div>
                            <data-widget rds-bind="acme" rds-readonly="false"></data-widget>
                            <formbuttons-widget></formbuttons-widget>
                        </div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </grid-widget>
                </form-widget>
                <div class="fill" rds-mode="setup#mode">
                    <form-widget class="fill-horz">
                        <div class="h1">##selectmode##</div>
                        <fieldset-widget rds-bind="systemMode" evt-input="set-mode">
                            [
                                { "value": "system#standalone", "text": "##standalone##" },
                                { "value": "system#serverteam", "text": "##serverteam##" }
                            ]
                        </fieldset-widget>
                    </form-widget>
                    <selector-panel rds-bind="systemMode">
                        <form-widget rds-mode="system#standalone" rds-submit="setStandalone,standalone">
                            ** STANDALONE SETUP **
                        </form-widget>
                        <form-widget rds-mode="system#serverteam" rds-submit="setMode=setServerTeam,serverteam">
                            ** SERVERTEAM SETUP **
                        </form-widget>
                    </selector-panel>
                </div>
            </selector-panel>
        </html>
    </widget>
</bundle>
