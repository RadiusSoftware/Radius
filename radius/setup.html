<!DOCTYPE httpx>
<bundle>
    <widget tagname="setup-app">
        <script type="settings">
            {
                "type": "app",
                "title": "##setup##",
                "path": "setupPath"
            }
        </script>
        <script>
            class SetupApp extends Widget {
            }
        </script>
        <html class="fill">
            <selector-widget class="fill" rds-bind-method="setMode,setupState">
                <form-widget class="fill" rds-mode="setup#acme" rds-action="certifyHost">
                    <grid-widget class="fill" rds-rows="50px,auto,50px" rds-cols="50px,auto,50px">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div>
                            <fieldset-widget rds-bind="test" rds-bind-options="options" rds-bind-legend="legend"></fieldset-widget><br>
                            <span rds-bind="test"></span><br>
                            <button-widget type="submit">##setupAcme##</button-widget>
                        </div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </grid-widget>
                </form-widget>
                <form-widget class="fill" rds-mode="setup#mode" rds-submit="setMode">
                    ** MODE SETUP **
                </form-widget>
            </selector-widget>
        </html>
    </widget>
    <strings lang="en">
        certifyHost = ACME Host Certification\
        setup = Radius Server Setup\
        setupAcme = Setup ACME\

        ONE = Eins\
        TWO = Zwei\
        THREE = Drei\
        FOUR = Vier\
        FIVE = Fünf\
    </strings>
</bundle>
