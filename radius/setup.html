<!DOCTYPE httpx>
<bundle>
    <widget tagname="setup-app">
        <script type="settings">
            {
                "type": "app",
                "title": "##setup##",
                "path": "setupPath",
                "width": 700,
                "horzMode": "maxx"
            }
        </script>
        <script>
            class SetupApp extends Widget {
                onCertifyHost(response) {
                    if (response.result && response.result.type == 'websocket') {
                        showDialog(
                            'close',
                            createElement(
                                'progress-widget',
                                {
                                    'rds-websocket-path': response.result.path,
                                }
                            )
                        );
                    }
                }

                onSetMode(response) {
                    // *********************************************************************************
                    // *********************************************************************************
                    console.log(response);
                }

                onConfigureMode(response) {
                    // *********************************************************************************
                    // *********************************************************************************
                }
            }
        </script>
        <html>
            <selector-panel class="fill" rds-bind="setupState">
                <form-widget class="fill" rds-mode="setup#acme" rds-action="certifyHost,acme">
                    <div class="h1">##acmeCertify##</div>
                    <data-widget rds-bind="acme" rds-readonly="false"></data-widget>
                    <formbuttons-widget></formbuttons-widget>
                </form-widget>
                <div class="fill" rds-mode="setup#mode">
                    <form-widget class="fill-horz" submit="setServerMode,systemState">
                        <div class="h1">##selectmode##</div>
                        <fieldset-widget rds-bind="systemMode" evt-input="set-mode">
                            [
                                { "value": "system#standalone", "text": "##standalone##" },
                                { "value": "system#serverteam", "text": "##serverteam##" }
                            ]
                        </fieldset-widget>
                    </form-widget>
                    <selector-panel rds-bind="systemMode">
                        <form-widget rds-mode="system#standalone" rds-action="setSystemMode,systemMode,dbms,serverteam">
                            ** STANDALONE SETUP **
                            <formbuttons-widget></formbuttons-widget>
                            <script>
                                () => 'Oh oh, a problem';
                            </script>
                        </form-widget>
                        <form-widget rds-mode="system#serverteam" rds-action="setSystemMode,systemMode,dbms,serverteam">
                            ** SERVERTEAM SETUP **
                            <formbuttons-widget></formbuttons-widget>
                        </form-widget>
                    </selector-panel>
                </div>
                <form class="fill" rds-mode="setup#mailer">
                    ** SETUP EMAILER **
                    <formbuttons-widget></formbuttons-widget>
                </form>
                <form class="fill" rds-mode="setup#user">
                    ** SETUP USER **
                    <formbuttons-widget></formbuttons-widget>
                </form>
            </selector-panel>
        </html>
    </widget>
</bundle>
