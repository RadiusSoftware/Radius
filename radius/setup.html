<!DOCTYPE httpx>
<bundle>
    <widget tagname="setup-app">
        <script type="settings">
            {
                "type": "app",
                "title": "##setup##",
                "path": "setupPath"
            }
        </script>
        <script>
            class SetupApp extends Widget {
                onCertifyHost(response) {
                    if (response.result && response.result.type == 'websocket') {
                        showDialog('close', '700px', '400px', 
                            createElement(
                                'progress-widget',
                                {
                                    'rds-websocket-path': response.result.path,
                                }
                            )
                        );
                    }
                    else {
                        // *******************************************************************
                        // *******************************************************************
                        alert('NEED ERROR DIAGLOG');
                    }
                }
            }
        </script>
        <html class="fill">
            <selector-widget class="fill" rds-bind-method="setMode,setupState">
                <form-widget class="fill" rds-mode="setup#acme" rds-action="certifyHost,acme">
                    <grid-widget class="fill" rds-rows="50px,auto,50px" rds-cols="50px,auto,50px">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div>
                            <data-widget rds-bind="acme" rds-readonly="false"></data-widget>
                            <formbuttons-widget></formbuttons-widget>
                        </div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </grid-widget>
                </form-widget>
                <form-widget class="fill" rds-mode="setup#mode" rds-submit="setMode=mode">
                    ** MODE SETUP **
                </form-widget>
            </selector-widget>
        </html>
    </widget>
    <strings lang="en">
        certifyHost = ACME Host Certification\
        setup = Radius Server Setup\
        setupAcme = Setup ACME\
    </strings>
</bundle>
